name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC: catches new toolchain/clippy warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (format, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check # package.json ↔ tauri.conf.json ↔ Cargo.toml/.lock
      - run: pnpm contrast # WCAG AA of every colour scheme
      - run: pnpm texts # no text in a template, no German outside *.de.ts
      - run: pnpm scripts:test
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # THIRD-PARTY-NOTICES.txt goes into every package: it must fit the dependencies
      - run: pnpm notices:check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false # see every platform's errors, not only the first
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # rust-cache keeps the directories of DuckDB's unpacked sources (target/duckdb-sources) but removes
      # their files; the build script of libduckdb-sys then fails with "Directory not empty"
      - name: Drop what the cache left of DuckDB's sources
        shell: bash
        run: rm -rf src-tauri/target/duckdb-sources
      # Debug builds compile in Tauri's dev mode (devUrl), so no frontend build is needed here.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
