[package]
name = "schema-commander"
version = "0.2.0"
description = "Cross-platform SQL client (Tauri 2 + Angular)"
authors = ["Marc Kronberg"]
license = "MIT"
repository = "https://github.com/krocon/schema-commander"
edition = "2024"
rust-version = "1.98.1"

# The MCP sidecar `schema-commander-mcp` and the bridge the app runs (prompt 048). A workspace member, so the
# debug sidecar lands in target/debug next to the app, where the app looks for it.
[workspace]
members = ["mcp"]

[lib]
name = "schema_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# searching in a result (prompt 029): linear-time matching; was in the dependency tree already
regex = "1"
# Walking skeleton: an in-memory demo database, so editor → Rust → result grid works without a
# server. Bundled (no system library), as in log-commander. The real drivers come with the
# connection prompt (prompts/README.md).
rusqlite = { version = "0.41", features = ["bundled", "column_decltype", "modern_sqlite"] }
# Drivers (prompt 003, the set log-commander proved in its prompt 019): pure Rust, TLS over rustls with the
# roots of the OS. The sqlx sub-crates instead of the `sqlx` facade: the facade names `sqlx-sqlite`
# (another libsqlite3-sys) even when unused, and two `links = "sqlite3"` cannot share a build with rusqlite.
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-native-roots", "chrono"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["chrono"] }
# `rsa`: MySQL 8 logs in with caching_sha2_password, which needs RSA on a connection without TLS.
sqlx-mysql = { version = "=0.9.0", default-features = false, features = ["chrono", "rsa"] }
# SQL Server (TDS); rustls, the ring provider is installed as the process default.
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono"] }
# Oracle (prompt 035b): the thin driver maintained by Oracle, pure Rust, no Instant Client. A beta – pinned.
oracledb = "=26.0.0-beta.5"
# DuckDB (prompt 035c): the library is built in (C++, a few minutes of build time, about 50 MB in the
# package); Parquet and JSON readers with it, so no extension has to be fetched.
duckdb = { version = "=1.20000.1", features = ["bundled", "parquet", "json"] }
# ClickHouse (prompt 035d) speaks HTTP: a small blocking client that is in the tree already (through
# Tauri's tooling), with rustls and the ring provider like the other drivers.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# Trino (prompt 035f): binary values come as base64, and a login is sent as one; in the tree already.
base64 = "0.22"
# Db2 (prompt 035l): DRDA in pure Rust, no client of IBM's (ibm_db needs its CLI library; the crate `db2`
# is an empty placeholder). An alpha by one author, so pinned to the version that was read.
justybase-db2 = "=0.1.0-alpha.3"
# Firebird (prompt 035i): the wire protocol in pure Rust. Young and by one author, so pinned; chosen over
# rsfbclient because it hands out NUMERIC values exactly (mantissa and scale), not as floats.
firebird-wire = { version = "=0.1.16", features = ["chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
# BigQuery and Snowflake (prompts 035j, 035k) sign a short-lived assertion with the key of an account
# (RS256): the library rustls already uses for its own signatures.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Passwords only in the keychain of the OS, wiped from memory when dropped (prompt 003).
keyring-core = "1"
zeroize = "1.8"
# Keychain account names are hashes: neither host nor user stand in the keychain's metadata.
sha2 = "0.11"
parking_lot = "0.12"
# Export (prompt 011): Excel files written row by row (pure Rust, MIT/Apache-2.0), and gzip for text files.
rust_xlsxwriter = { version = "0", default-features = false, features = ["constant_memory"] }
flate2 = "1"
# SSH tunnels (prompt 014, the set log-commander proved in its prompt 017): pure Rust, no OpenSSL (ring).
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
# The known_hosts parser (hashed hosts are HMAC-SHA1 with Base64 salts); all in the tree through russh.
data-encoding = "2"
hmac = "0.13"
sha1 = "0.11"
# The clipboard (prompt 009): text and HTML, written by Rust so that a million rows never pass the WebView.
# Without the image feature; `wayland-data-control` for Wayland without XWayland.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Saved queries (prompt 024): deleting moves the file to the trash of the OS (as in files-and-folders-tauri).
# `freedesktop` is the implementation for Linux: without it the crate does not compile there.
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded", "freedesktop"] }
serde = { version = "1", features = ["derive"] }
# raw_value: the import (prompt 033) keeps numbers of a JSON file digit for digit
serde_json = { version = "1", features = ["raw_value"] }
# showplan XML of SQL Server (prompt 039); already in the tree through tauri
quick-xml = "0.42"
tauri = { version = "2", features = [] }
# Native open/save dialogs (import and export of colour schemes, later SQL files and exports).
tauri-plugin-dialog = "2"
# Settings (colour scheme, layout) as one JSON file in the app's config folder.
tauri-plugin-store = "2"
# Window position and size over a restart.
tauri-plugin-window-state = "2"

# Keychain of the OS: Secret Service over D-Bus on Linux, Keychain on macOS, Credential Manager on Windows.
# The bridge to the MCP sidecar (prompt 048): our own crate, only std and serde.
sc-mcp = { path = "mcp" }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
